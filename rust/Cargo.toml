[package]
name = "osprey-bench-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reproducible benchmark runner for OspreyDB (1-bit RaBitQ + DP range coalescing + LUT-Rank)"

[dependencies]
osprey-core = { git = "https://github.com/ospreydb/osprey-engine.git", branch = "main" }
osprey-simd = { git = "https://github.com/ospreydb/osprey-engine.git", branch = "main" }
osprey-storage = { git = "https://github.com/ospreydb/osprey-engine.git", branch = "main" }

clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
memmap2 = "0.9"
object_store = { version = "0.11", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
