services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: osprey-bench-minio
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: osprey
      MINIO_ROOT_PASSWORD: ospreypassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data

  minio-netem:
    build:
      context: .
      dockerfile: Dockerfile.netem
    container_name: osprey-bench-minio-netem
    network_mode: "service:minio"
    cap_add:
      - NET_ADMIN
    depends_on:
      - minio
    environment:
      NETEM_DELAY: "${NETEM_DELAY:-15ms}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; do
          sleep 1
        done
        tc qdisc replace dev eth0 root netem delay $${NETEM_DELAY}
        echo "MinIO tc netem active on eth0:"
        tc qdisc show dev eth0
        trap 'tc qdisc del dev eth0 root 2>/dev/null || true; exit 0' TERM INT
        while true; do sleep 3600; done

  qdrant:
    image: qdrant/qdrant:latest
    container_name: osprey-bench-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 15

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: osprey-bench-pgvector
    environment:
      POSTGRES_USER: osprey
      POSTGRES_PASSWORD: ospreypassword123
      POSTGRES_DB: osprey_bench
    ports:
      - "5433:5432"
    volumes:
      - ./pgvector-data:/var/lib/postgresql/data
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osprey -d osprey_bench"]
      interval: 3s
      timeout: 3s
      retries: 15
